<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMW – Job Status</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e4e7ec;--ac:#1f3864;--ok:#067647;--er:#b42318;--il:36%;--gl:#cfd4dc;--hf:#e8edf6;--zb:#f4f6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202b;--tx:#e6eaf0;--mu:#98a2b3;--bd:#2a3442;--ac:#9db7ee;--ok:#75e0a7;--er:#fda29b;--il:72%;--gl:#3a4657;--hf:#22304a;--zb:#1d2633;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--tx:#e6eaf0;--mu:#98a2b3;--bd:#2a3442;--ac:#9db7ee;--ok:#75e0a7;--er:#fda29b;--il:72%;--gl:#3a4657;--hf:#22304a;--zb:#1d2633;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:680px;margin:0 auto;padding:16px}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
h1{margin:0;font-size:26px}.co{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{padding:10px 6px;text-align:left;border:1px solid var(--gl);font-size:15px;vertical-align:middle}
th{font-size:12px;color:var(--ac);font-weight:700;background:var(--hf)}tr:nth-child(even) td{background:var(--zb)}tr:nth-child(n) td.ic{background:var(--hf)}
.rm{font-size:13px;overflow-wrap:anywhere}.od{color:var(--er);font-weight:600}.dn{color:var(--ok);font-weight:600}.n{text-align:center}
.b{font:inherit;padding:8px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.sc{overflow-x:auto;margin:10px 0}.et{width:860px}.et td{padding:3px}.et input{padding:6px 4px;font-size:14px;width:100%;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}.et .d{margin:0;padding:4px 10px;color:var(--er)}.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pw{width:160px;padding:8px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}.ban{background:var(--hf);border:1px solid var(--gl);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px}.ft{margin-top:18px;text-align:center}.ft a{color:var(--mu)}
</style></head><body><div class="w" id="root"></div>
<script>
/* ===== SETUP: paste your Apps Script Web app URL (ends with /exec) between the quotes ===== */
const API="https://script.google.com/macros/s/AKfycbxd1dcBsDKbX5SL91Xh7Tm48r1NcaVJO7jlulzgGn3wiVKdRTpiwIr0yBqvUNPSs1OL/exec";
/* ======================================================================================== */
const DEMO=[["2026-10-05","S101",8,"","Delivered",8,"2026-10-20"],["2026-10-06","S21",16,"","Delivered",16,"2026-10-12"],["2026-10-20","S163",13,"","Waiting for shot blasting","",""],["2026-10-20","S101",2,"2026-11-02","2 nos - 1st opr complete","",""],["2026-10-20","S102",4,"2026-10-30","4 nos - 1st opr complete","",""],["2026-10-23","S102",3,"2026-10-29","3 nos - 1st opr complete","",""],["2026-10-27","S102",4,"2026-10-31","4 nos - 1st opr under progress","",""]].map(r=>({date:r[0],item:r[1],qty:r[2],exp:r[3],status:r[4],delQty:r[5],delDate:r[6]}));
const demo=API.startsWith("PASTE"),OWNER=location.hash==='#owner',ISO=/^\d{4}-\d{2}-\d{2}$/;
let jobs=demo?DEMO:[],state=demo?'ok':'load',ver=demo?'0':'',stamp=demo?new Date():null,mode='view',draft=[];
const el=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const ic=k=>{let h=5381;for(const c of String(k))h=(h*33+c.charCodeAt(0))>>>0;return `color:hsl(${Math.round((h%997)*137.508%360)} 65% var(--il))`};
const T0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const P=s=>s?new Date(s+'T00:00:00'):null;
const D=s=>s?P(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const sums=()=>{const m={};jobs.forEach(j=>{const k=String(j.item).trim();if(!k)return;const o=m[k]=m[k]||{i:0,o:0,e:'',s:[]};o.i+=N(j.qty);o.o+=N(j.delQty);if(N(j.qty)-N(j.delQty)>0){if(j.exp&&(!o.e||j.exp<o.e))o.e=j.exp;if(j.status)o.s.push(j.status)}});return Object.entries(m).map(([k,o])=>({k,i:o.i,o:o.o,b:o.i-o.o,e:o.e,s:o.s})).sort((a,b)=>(a.b<=0)-(b.b<=0))};
const mapRow=r=>({date:ISO.test(r[0])?r[0]:'',item:String(r[1]||'').trim(),qty:r[2],exp:ISO.test(r[3])?r[3]:'',status:String(r[4]||'').trim(),delQty:r[5],delDate:ISO.test(r[6])?r[6]:''});
function view(){
 const cut=iso(new Date(T0().getTime()-30*864e5));
 const done=jobs.filter(j=>N(j.delQty)>0&&j.delDate>=cut).sort((a,b)=>a.delDate<b.delDate?1:-1);
 const sd=/^\d{9,}$/.test(ver)?new Date(+ver):stamp;
 const upd=sd?sd.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'…';
 const body=state=='err'?'<div class="card od">Could not load the data. Please try again in a minute.</div>':state=='load'?'<div class="card mu">Loading…</div>':
 `<div class="card"><table><colgroup><col style="width:14%"><col style="width:8%"><col style="width:8%"><col style="width:13%"><col style="width:19%"><col style="width:38%"></colgroup><tr><th>Item</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th><th>Expected delivery</th><th>Status</th></tr>${sums().map(t=>`<tr><td class="ic"><b style="${ic(t.k)}">${E(t.k)}</b></td><td class="n">${t.i}</td><td class="n">${t.o}</td><td class="n"><b>${t.b}</b></td><td class="${t.b<=0?'dn':(t.e&&P(t.e)<T0()?'od':'')}">${t.b<=0?'Delivered':(t.e?D(t.e):'Yet to Plan')}</td><td class="rm">${t.b<=0?'':t.s.map(E).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">No jobs yet.</td></tr>'}</table></div>
<details><summary>Delivered in last 30 days (${done.length})</summary><table><tr><th>Item</th><th class="n">Qty</th><th>Delivered on</th></tr>${done.map(j=>`<tr><td class="ic"><b style="${ic(j.item)}">${E(j.item)}</b></td><td class="n">${E(j.delQty)}</td><td class="dn">${D(j.delDate)}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">None</td></tr>'}</table></details>`;
 return `<div class="hd"><div><div class="co">General Machine Works</div><h1>Job Status</h1><div class="mu">Updated ${upd}</div></div><div class="row"><button class="b" onclick="load()">↻</button>${OWNER?'<button class="b p" onclick="startEdit()">Edit</button>':''}</div></div>${demo?'<div class="ban">Demo data. Paste your Web app URL in the SETUP line of this file to show real data.</div>':''}${body}`}
const FL=[['date','date'],['item','text'],['qty','number'],['exp','date'],['status','text'],['delQty','number'],['delDate','date']];
function editView(){return `<div class="hd"><h1>Edit jobs</h1><div class="row"><button class="b" onclick="addRow()">+ Row</button><input class="pw" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" onclick="save()">Save</button><button class="b" onclick="go('view')">Cancel</button></div></div><div id="msg" class="mu">Tap any cell to edit. Leave Exp date empty if not planned. ✕ deletes a row.</div><datalist id="il">${sums().map(t=>`<option value="${E(t.k)}">`).join('')}</datalist><div class="sc"><table class="et"><colgroup><col style="width:34px"><col style="width:122px"><col style="width:84px"><col style="width:70px"><col style="width:122px"><col style="width:200px"><col style="width:70px"><col style="width:122px"><col style="width:44px"></colgroup><tr><th class="n">#</th><th>Date</th><th>Item</th><th>Qty</th><th>Exp delivery</th><th>Status</th><th>Del qty</th><th>Del date</th><th></th></tr>`+draft.map((j,i)=>`<tr><td class="n">${i+1}</td>${FL.map(([k,t])=>`<td><input type="${t}" ${k=='item'?'list="il" ':''}value="${E(j[k])}" oninput="draft[${i}].${k}=this.value"></td>`).join('')}<td><button class="b d" onclick="delRow(${i})">✕</button></td></tr>`).join('')+'</table></div>'}
function render(){el('root').innerHTML=mode=='edit'?editView():view()}
function go(m){mode=m;render();scrollTo(0,0)}
function fetchData(){return new Promise((res,rej)=>{if(demo){res({ok:true,v:ver,rows:null});return}
 const cb='__cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
 const done=()=>{clearTimeout(t);delete window[cb];s.remove()},t=setTimeout(()=>{done();rej(new Error('timeout'))},15000);
 window[cb]=d=>{done();d&&d.ok?res(d):rej(new Error('bad'))};s.onerror=()=>{done();rej(new Error('net'))};
 s.src=`${API}${API.includes('?')?'&':'?'}callback=${cb}&_=${Date.now()}`;document.body.appendChild(s)})}
async function load(){try{const d=await fetchData();if(d.rows)jobs=d.rows.map(mapRow).filter(j=>j.item);ver=d.v;stamp=new Date();state='ok'}catch(e){state='err'}if(mode=='view')render()}
async function startEdit(){await load();draft=jobs.map(j=>({...j}));go('edit')}
function addRow(){draft.push({date:iso(T0()),item:'',qty:'',exp:'',status:'',delQty:'',delDate:''});render();scrollTo(0,document.body.scrollHeight)}
function delRow(i){if(confirm('Delete this row?')){draft.splice(i,1);render()}}
function post(f){let fr=el('sink');if(!fr){fr=document.createElement('iframe');fr.name=fr.id='sink';fr.hidden=true;document.body.appendChild(fr)}
 const form=document.createElement('form');form.method='POST';form.action=API;form.target='sink';form.hidden=true;
 for(const k in f){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=f[k];form.appendChild(i)}
 document.body.appendChild(form);form.submit();form.remove()}
async function save(){const m=el('msg'),pw=el('pw').value;if(!pw){m.textContent='Enter the password.';return}
 if(demo){m.textContent='Demo mode: connect your Web app URL first.';return}
 const rows=draft.filter(j=>String(j.item).trim()).map(j=>({...j,item:String(j.item).trim()}));
 m.textContent='Saving…';const before=ver;post({pw,payload:JSON.stringify(rows)});
 for(let i=0;i<10;i++){await sleep(1500);try{const d=await fetchData();if(d.v!==before){jobs=d.rows.map(mapRow).filter(j=>j.item);ver=d.v;go('view');return}}catch(e){}}
 m.textContent='Not saved. Check the password and your internet, then try again.'}
render();load();setInterval(()=>{if(mode=='view')load()},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode=='view')load()});
</script></body></html>
